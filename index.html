<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>업체 정보 검색</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업체검색">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --text:#1c2430; --sub:#66707d; --line:#dfe4ea;
  --accent:#1f5fbf; --accent-bg:#e6effc; --stop:#b3261e; --stop-bg:#fde8e6;
  --add-bg:#e3f0ff; --chk-bg:#fff1c7; --chk:#8a5a00; --mute-bg:#eef0f3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161c; --card:#1c222b; --text:#e8ecf1; --sub:#9aa5b3; --line:#2e3742;
    --accent:#7fb0ff; --accent-bg:#1d2f4d; --stop:#ff8a80; --stop-bg:#4a211e;
    --add-bg:#1d2f4d; --chk-bg:#4a3a10; --chk:#ffd479; --mute-bg:#262d37;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;
  padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:8px}
#q,#pw,#nm{flex:1;min-width:0;font-size:18px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--text);outline:none;-webkit-appearance:none}
#q:focus,#pw:focus,#nm:focus{border-color:var(--accent)}
#nm{flex:1 1 100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media (prefers-color-scheme: dark){.btn.primary{color:#0d1420}}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px;color:var(--sub);align-items:center}
.filters label{display:flex;align-items:center;gap:5px}
.filters input{width:18px;height:18px}
#count{margin-left:auto;font-variant-numeric:tabular-nums}
main{padding:10px 14px 40px}
.hint{color:var(--sub);font-size:14px;margin:6px 2px 12px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item .nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.item .sub{color:var(--sub);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;
  background:var(--accent-bg);color:var(--accent);vertical-align:2px;white-space:nowrap}
.badge.stop{background:var(--stop-bg);color:var(--stop)}
.badge.mute{background:var(--mute-bg);color:var(--sub)}
#more{display:block;margin:12px auto}
#detail,#login{display:none}
body.detail #list,body.detail header{display:none}
body.detail #detail{display:block}
body.locked #list,body.locked header,body.locked #detail{display:none}
#logs{display:none}
body.logs #list,body.logs header,body.logs #detail{display:none}
body.logs #logs{display:block}
#apw{flex:1;min-width:0;font-size:18px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--text);outline:none;-webkit-appearance:none}
.logrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.logrow .lt{font-size:13px;color:var(--sub)}
.logrow .la{font-weight:700;overflow-wrap:anywhere}
.logrow .lq{font-size:14px;color:var(--accent);overflow-wrap:anywhere}
#logView select{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1.5px solid var(--line);
  border-radius:8px;padding:5px 8px;max-width:48%}
#logMore{display:block;margin:12px auto}
body.locked #login{display:block}
#login .box{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 20px}
#login h1{margin:0 0 6px}
#login p{color:var(--sub);margin:0 0 18px;font-size:15px}
#login form{display:flex;flex-wrap:wrap;gap:8px}
#loginMsg{color:var(--stop);margin-top:12px;min-height:1.5em;font-size:15px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 14px;
  padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.back{border:0;background:none;color:var(--accent);padding:6px 0;font-size:16px}
h1{font-size:21px;line-height:1.3;margin:12px 0 10px;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.kv{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{flex:0 0 88px;color:var(--sub);font-size:14px;padding-top:1px}
.kv .v{flex:1;min-width:0;overflow-wrap:anywhere}
a{color:var(--accent);text-decoration:none}
h2{font-size:16px;margin:18px 2px 8px}
h2 small{color:var(--sub);font-weight:400}
.mach{padding:11px 14px;border-top:1px solid var(--line)}
.mach:first-child{border-top:0}
.mach.add{background:var(--add-bg)}
.mach.chk{background:var(--chk-bg)}
.mach.hit{box-shadow:inset 4px 0 0 var(--accent)}
.mach .hd{font-weight:700;overflow-wrap:anywhere}
.mach .sn{font-family:ui-monospace,Consolas,monospace;font-weight:400;margin-left:6px}
.mach .ln{font-size:14px;margin-top:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.mach .jk{color:var(--sub)}
.mach .flow{color:var(--accent);font-weight:700}
.mach .flow.warn{color:var(--chk)}
.mach .fx b{display:inline-block;min-width:3.6em;margin-right:6px;color:var(--sub);font-weight:700}
.mach .fx.fl{font-weight:400}
.sortrow{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 2px 8px;font-size:13px;color:var(--sub)}
.sortrow select{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1.5px solid var(--line);
  border-radius:8px;padding:5px 8px}
.sortrow .money{display:flex;align-items:center;gap:5px;margin-right:auto;font-size:14px}
.sortrow .money input{width:18px;height:18px}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme: dark){mark{background:#8a6a12}}
.mach.gone .hd,.mach.gone .flow{color:var(--sub)}
.mach .fl{color:var(--chk);font-weight:700}
.st{float:right;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:8px;
  background:var(--mute-bg);color:var(--sub)}
.notes{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.foot{color:var(--sub);font-size:13px;text-align:center;margin-top:24px}
.foot button{border:0;background:none;color:var(--accent);font-size:13px;padding:6px 8px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(30,34,40,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="searchrow">
    <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" placeholder="업체명 · 주소 · 사업자번호 · 기종 · 기번" aria-label="검색어">
    <button class="btn" id="clear" type="button">지우기</button>
  </div>
  <div class="filters">
    <label><input type="checkbox" id="fStop" checked> 거래중단·타부서</label>
    <label><input type="checkbox" id="fEtc" checked> 매입처·양식 외</label>
    <span id="count"></span>
  </div>
</div></header>
<main class="wrap" id="list">
  <p class="hint" id="hint"></p>
  <div id="results"></div>
  <button class="btn" id="more" type="button" hidden>더 보기</button>
  <p class="foot"><span id="foot"></span><br><span id="sync"></span>
    <span id="tools" hidden><br><button id="reload" type="button">지금 새로 받기</button>
    <button id="install" type="button" hidden>앱으로 설치</button>
    <button id="lock" type="button">비밀번호 다시 입력</button>
    <button id="logsBtn" type="button">사용 기록 (관리자)</button></span></p>
  <p class="foot" id="iosTip" hidden>아이폰: 아래쪽 공유 버튼(□↑) → “홈 화면에 추가”를 누르면 앱처럼 쓸 수 있습니다.</p>
</main>
<section id="detail">
  <div class="top"><div class="wrap"><button class="back" id="back" type="button">‹ 검색 결과로</button></div></div>
  <div class="wrap" style="padding:0 14px 48px" id="dbody"></div>
</section>
<section id="logs">
  <div class="top"><div class="wrap"><button class="back" id="logsBack" type="button">‹ 검색으로</button></div></div>
  <div class="wrap" style="padding:0 14px 48px">
    <h1>사용 기록</h1>
    <form id="adminForm" hidden>
      <p class="hint">관리자 비밀번호를 입력하세요. 한 번 입력하면 이 기기에 기억됩니다.</p>
      <div class="searchrow"><input id="apw" type="password" autocomplete="off" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호">
      <button class="btn primary" type="submit">확인</button></div>
      <p id="adminMsg" class="hint" style="color:var(--stop)"></p>
    </form>
    <div id="logView" hidden>
      <div class="sortrow" style="justify-content:flex-start;flex-wrap:wrap">
        <select id="logWho" aria-label="사람"></select><select id="logWhat" aria-label="동작"></select>
        <span id="logCount" style="margin-left:auto"></span>
      </div>
      <div id="logList"></div>
      <button class="btn" id="logMore" type="button" hidden>더 보기</button>
      <p class="foot"><span id="logBuilt"></span><br>
        <button id="logReload" type="button">지금 새로 받기</button> <button id="logForget" type="button">관리자 비밀번호 지우기</button></p>
    </div>
  </div>
</section>
<section id="login"><div class="box">
  <h1 id="loginTitle">업체 정보 검색</h1>
  <p id="loginHelp">회사에서 안내받은 비밀번호를 입력하세요. 한 번만 입력하면 이 기기에 기억됩니다.</p>
  <form id="loginForm">
    <input id="nm" type="text" autocomplete="name" placeholder="본인 이름 (예: 홍길동)" aria-label="본인 이름" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
    <button class="btn primary" type="submit">확인</button>
  </form>
  <div id="loginMsg" role="alert"></div>
</div></section>
<div id="toast" role="status"></div>
<script>
const EMBED = /*__DATA__*/null;
const SHELL = "9d9448298e4f";  // 이 화면의 버전 (올릴 때 채워진다)
const LOG = {"url": "https://docs.google.com/forms/d/e/1FAIpQLSfMStE-5e1e4yCq_37KX9u2L5MtB_OePE63n6YSVGSRJLi1wg/formResponse", "entry": "entry.1798926446", "pub": "BOcWc5fFsom2OcMS6OLypEOot6mNGvA/rymyR72E99RATBLMb3o6TTUd6jfTnL9mYT3UXl6BDgZrcZg+2RW70UE=", "round": 2};   // 사용 기록을 보낼 곳 {url, entry, pub}. 연결되어 있지 않으면 null (기록하지 않고 이름도 묻지 않음)
let DATA = null, LIST = [];
const CAT_ORDER = {"거래처":0,"매입처":1,"거래중단·타부서":2,"족보 전용":3,"장부 전용":4,"양식 외":5};
const FIELD = ["업체명","사업자번호","장비","주소","전화/FAX","대표자","기타 내용"];
const CORP = /\(\s*[주유합재사株]\s*\)|주식회사|유한회사|합자회사|재단법인|사단법인|株式会社/g;
const PAGE = 60;
const $ = id => document.getElementById(id);
let results = [], shown = 0, tokens = [];

function norm(s){
  return s.normalize("NFKC").replace(CORP, " ").toLowerCase().replace(/[^0-9a-z가-힣一-鿿ぁ-ヿ]/g, "");
}
function esc(s){
  return String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}
// 장비의 현황(첫 줄)과 들어옴·대금·나감·확인 줄을 나눠 보여 준다
function flowHtml(text){
  const [now, ...rest] = text.split("\n");
  const warn = /계약 중|확인 필요/.test(now) ? " warn" : "";
  return `<div class="ln flow${warn}">${esc(now)}</div>` + rest.map(line => {
    const i = line.indexOf(": ");
    return i < 0 ? `<div class="ln fx">${esc(line)}</div>`
      : `<div class="ln fx${line.startsWith("확인") ? " fl" : ""}"><b>${esc(line.slice(0, i))}</b>${esc(line.slice(i + 2))}</div>`;
  }).join("");
}
// 전화번호는 누르면 전화, 메일 주소는 누르면 메일 작성
function linkify(s){
  return esc(s).replace(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}|0\d{1,2}[-.\s)]{1,2}\d{3,4}[-.\s]\d{4}|1[5-9]\d{2}-\d{4}/g,
    m => m.includes("@") ? `<a href="mailto:${m}">${m}</a>` : `<a href="tel:${m.replace(/[^\d]/g, "")}">${m}</a>`);
}
function badge(cat){
  const cls = cat === "거래중단·타부서" ? " stop" : (cat === "양식 외" || cat === "족보 전용" || cat === "장부 전용") ? " mute" : "";
  return `<span class="badge${cls}">${esc(cat)}</span>`;
}

function search(){
  const cats = new Set(["거래처", "족보 전용", "장부 전용"]);
  if ($("fStop").checked) cats.add("거래중단·타부서");
  if ($("fEtc").checked) { cats.add("매입처"); cats.add("양식 외"); }
  tokens = $("q").value.normalize("NFKC").split(/\s+/).map(norm).filter(Boolean);
  const out = [];
  LIST.forEach((c, idx) => {
    if (!cats.has(c.c)) return;
    if (!tokens.length) { out.push([0, idx, ""]); return; }
    let score = 0; const hits = [];
    for (const t of tokens) {
      let found = false;
      // 네 자리 이하 숫자(예: 3058)는 기종·전화 끝자리를 찾는 것으로 보고, 사업자번호(1)·기타 내용(6)에서는 찾지 않는다
      const shortNumber = /^\d{1,4}$/.test(t);
      for (let f = 0; f < 7; f++) {
        if (shortNumber && (f === 1 || f === 6)) continue;
        if (!c.s[f].includes(t)) continue;
        if (f === 0) score += c.k === t ? 0 : c.k.startsWith(t) ? 1 : 2;
        else { score += f + 2; if (!hits.includes(FIELD[f])) hits.push(FIELD[f]); }
        found = true; break;
      }
      if (!found) return;
    }
    out.push([score, idx, hits.join(", ")]);
  });
  out.sort((a, b) => a[0] - b[0] || CAT_ORDER[LIST[a[1]].c] - CAT_ORDER[LIST[b[1]].c] || a[1] - b[1]);
  results = out; shown = 0;
  $("results").innerHTML = "";
  $("count").textContent = (tokens.length ? "" : "전체 ") + out.length.toLocaleString() + "건";
  $("hint").textContent = tokens.length
    ? (out.length ? "" : "검색 결과가 없습니다. 띄어 쓴 단어가 모두 들어 있는 업체만 나옵니다.")
    : "업체명·주소·사업자번호·전화·대표자·기종·기계번호(기번) 중 아무거나 입력하세요. 띄어 쓰면 모두 포함된 업체만 나옵니다. 예) 경산 C3000";
  renderMore();
  // 사용 기록: 글자를 치는 중간 단계는 남기지 않고, 잠시 멈춘 검색어만 남긴다
  clearTimeout(logTimer);
  const q = $("q").value.trim(), n = out.length;
  if (q) logTimer = setTimeout(() => logQuery(q, n), 1500);
}
function logQuery(q, n){
  clearTimeout(logTimer);
  if (q && q !== loggedQuery) { loggedQuery = q; logEvent("검색", `결과 ${n}건`, q); }
}
function renderMore(){
  const html = [];
  for (const [, idx, hit] of results.slice(shown, shown + PAGE)) {
    const c = LIST[idx];
    const info = Object.fromEntries(c.i);
    const sub = [hit ? "일치: " + hit : "", info["주소"] || "", info["대표자"] ? "대표 " + info["대표자"] : ""]
      .filter(Boolean).join(" · ");
    html.push(`<button class="item" type="button" data-i="${idx}"><div class="nm">${esc(c.n)}${badge(c.c)}</div>`
      + (sub ? `<div class="sub">${esc(sub)}</div>` : "") + `</button>`);
  }
  $("results").insertAdjacentHTML("beforeend", html.join(""));
  shown = Math.min(results.length, shown + PAGE);
  $("more").hidden = shown >= results.length;
}

function infoText(c){ return c.t.split("\n\n▶")[0]; }
// 거래 금액은 기본으로 숨긴다. 켜면 장비 줄과 '전체 복사' 글에 금액이 들어간다 (이 핸드폰에만 기억)
function moneyOn(){ return localStorage.getItem("upche-money") === "1"; }
function fullText(c){ return moneyOn() && c.tm ? c.tm : c.t; }

// 검색어가 들어 있는 글자를 노랗게 칠한다 (왜 이 업체가 나왔는지 보이도록).
// 검색과 같은 기준으로 비교하므로 띄어쓰기·하이픈이 달라도 찾는다. 돌려주는 값: 원문에서의 [시작, 끝] 목록
function matchSpans(text, toks){
  const chars = [], idx = [];
  for (let i = 0; i < text.length; i++)
    for (const c2 of text[i].normalize("NFKC")) { chars.push(c2); idx.push(i); }
  const s = chars.join("").replace(CORP, m => " ".repeat(m.length)).toLowerCase();
  const keep = [];
  for (let j = 0; j < s.length && j < idx.length; j++)
    if (/[0-9a-z가-힣一-鿿ぁ-ヿ]/.test(s[j])) keep.push([s[j], idx[j]]);
  const flat = keep.map(k => k[0]).join("");
  const spans = [];
  for (const t of toks) {
    let at = flat.indexOf(t);
    while (at >= 0) { spans.push([keep[at][1], keep[at + t.length - 1][1] + 1]); at = flat.indexOf(t, at + t.length); }
  }
  spans.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const sp of spans) {
    const last = merged[merged.length - 1];
    if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]); else merged.push(sp);
  }
  return merged;
}
function markHits(root){
  if (!tokens.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const p = node.parentElement;
    if (!p || p.closest("button,select,label,.k,.st,.foot,h2,.badge")) continue;
    // 사업자번호는 검색과 같은 규칙: 네 자리 이하 숫자로는 찾지 않는다
    const toks = p.closest('[data-k="사업자등록번호"]') ? tokens.filter(t => !/^\d{1,4}$/.test(t)) : tokens;
    const text = node.nodeValue, spans = matchSpans(text, toks);
    if (!spans.length) continue;
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const [s, e] of spans) {
      frag.append(text.slice(pos, s));
      const m = document.createElement("mark");
      m.textContent = text.slice(s, e);
      frag.append(m);
      pos = e;
    }
    frag.append(text.slice(pos));
    node.replaceWith(frag);
  }
}

// 장비 정렬 (PC 프로그램과 같은 기준). 값이 없는 줄은 항상 뒤로 보낸다. r[13] = 설치일 또는 기번으로 본 연도
const SORTS = ["기종순", "설치일 최신순", "설치일 오래된순", "기번순", "확인 필요 먼저", "원본 순서"];
const ST_ORDER = {"확인 필요":0, "족보 추가":1, "기번 보완":2, "일치":3, "업체정보":4, "이전 기재":5, "거래 기록":6};
function sortMachines(rows, mode){
  const a = rows.slice();
  const cmp = (x, y) => x < y ? -1 : x > y ? 1 : 0;
  const serial = r => r[2].normalize("NFKC").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (mode === "기종순") a.sort((x, y) => (!x[1] - !y[1]) || cmp(norm(x[1]), norm(y[1])) || y[13] - x[13]);
  else if (mode === "설치일 최신순") a.sort((x, y) => (!x[13] - !y[13]) || y[13] - x[13] || cmp(norm(x[1]), norm(y[1])));
  else if (mode === "설치일 오래된순") a.sort((x, y) => (!x[13] - !y[13]) || x[13] - y[13] || cmp(norm(x[1]), norm(y[1])));
  else if (mode === "기번순") a.sort((x, y) => (!x[2] - !y[2]) || cmp(serial(x), serial(y)));
  else if (mode === "확인 필요 먼저") a.sort((x, y) => (ST_ORDER[x[0]] ?? 9) - (ST_ORDER[y[0]] ?? 9) || cmp(norm(x[1]), norm(y[1])));
  return a;
}

// ---- 웹앱: 암호화된 자료를 받아 풀고, 기기에 보관하고, 바뀌면 다시 받는다 ----
// 파일 구조: "UPCH1"(5) | gzip 여부(1) | salt(16) | iv(12) | AES-256-GCM 암호문
const DATA_URL = "DecompressionStream" in window ? "data.gz.bin" : "data.bin";
const K_KEY = "upche-key", K_VER = "upche-ver";
let lastCheck = 0, refreshing = false, installEvent = null;
const b64enc = u8 => btoa(String.fromCharCode(...u8));
const b64dec = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

async function deriveKey(password, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    {name: "PBKDF2", hash: "SHA-256", salt, iterations: 600000}, base, 256));
}
async function decrypt(buf, rawKey){
  const u = new Uint8Array(buf);
  if (new TextDecoder().decode(u.subarray(0, 5)) !== "UPCH1") throw new Error("format");
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: u.subarray(22, 34)}, key, u.subarray(34));
  const text = u[5] === 1
    ? await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    : new TextDecoder().decode(plain);
  return JSON.parse(text);
}
async function cachedData(){
  try { const r = await (await caches.open("upche-data")).match("data"); return r ? await r.arrayBuffer() : null; }
  catch (e) { return null; }
}
async function storeData(buf){
  try { await (await caches.open("upche-data")).put("data", new Response(buf)); } catch (e) {}
}
async function remoteVersion(){
  const r = await fetch("version.json?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function fetchData(v){
  const r = await fetch(DATA_URL + "?v=" + encodeURIComponent(v), {cache: "no-store"});
  if (!r.ok) throw new Error("http " + r.status);
  return r.arrayBuffer();
}

// ---- 사용 기록: 누가 무엇을 검색·조회했는지 잠가서 보낸다. 풀어 볼 수 있는 것은 관리자 PC 뿐이다 ----
const K_NAME = "upche-name", K_LOGQ = "upche-logq", K_ROUND = "upche-name-round";
let flushing = false, logTimer = null, loggedQuery = "";
function device(){
  const ua = navigator.userAgent;
  if (/iphone|ipad|ipod/i.test(ua)) return "아이폰";
  const m = ua.match(/Android[^;)]*;\s*([^;)]+?)(?:\s+Build|\))/);
  return /android/i.test(ua) ? "안드로이드" + (m ? " " + m[1] : "") : "브라우저";
}
// 핸드폰마다 붙는 고유 번호 (예: 핸드폰-K7Q2). 처음 한 번 만들어 이 핸드폰에 보관한다.
// 입력한 이름을 바꾸어도 같은 핸드폰이라는 것을 알 수 있게 하려는 것. 헷갈리는 글자(0·O·1·I·L)는 쓰지 않는다
function deviceId(){
  let id = localStorage.getItem("upche-device");
  if (!id) {
    const abc = "23456789ABCDEFGHJKMNPQRSTUVWXYZ", r = crypto.getRandomValues(new Uint8Array(4));
    id = "핸드폰-" + Array.from(r, n => abc[n % abc.length]).join("");
    localStorage.setItem("upche-device", id);
  }
  return id;
}
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function concat(...parts){
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}
async function sealLog(text){
  const enc = new TextEncoder(), pub = b64dec(LOG.pub);
  const peer = await crypto.subtle.importKey("raw", pub, {name: "ECDH", namedCurve: "P-256"}, false, []);
  const eph = await crypto.subtle.generateKey({name: "ECDH", namedCurve: "P-256"}, true, ["deriveBits"]);
  const ephPub = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const shared = await crypto.subtle.deriveBits({name: "ECDH", public: peer}, eph.privateKey, 256);
  const hk = await crypto.subtle.importKey("raw", shared, "HKDF", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: concat(enc.encode("upche-log-m1"), ephPub, pub)},
    hk, {name: "AES-GCM", length: 256}, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, enc.encode(text)));
  return "m1:" + b64enc(concat(ephPub, iv, ct));
}
function logEvent(action, detail, query){
  if (!LOG || EMBED) return;
  const rec = {t: stamp(), ms: Date.now(), u: localStorage.getItem(K_NAME) || "(이름 없음)",
               pc: deviceId() + " · " + device(), dev: deviceId(),
               a: action, d: detail || "", q: query || "", v: "앱"};
  sealLog(JSON.stringify(rec)).then(line => {
    const queue = JSON.parse(localStorage.getItem(K_LOGQ) || "[]");
    queue.push(line);
    localStorage.setItem(K_LOGQ, JSON.stringify(queue.slice(-300)));  // 인터넷이 안 될 때는 모아 두었다가 보낸다
    flushLog();
  }).catch(() => {});
}
async function flushLog(){
  if (flushing || !LOG || !navigator.onLine) return;
  flushing = true;
  try {
    for (;;) {
      const queue = JSON.parse(localStorage.getItem(K_LOGQ) || "[]");
      if (!queue.length) break;
      const body = new URLSearchParams();
      body.set(LOG.entry, queue[0]);
      await fetch(LOG.url, {method: "POST", mode: "no-cors", body});
      const rest = JSON.parse(localStorage.getItem(K_LOGQ) || "[]");
      rest.shift();
      localStorage.setItem(K_LOGQ, JSON.stringify(rest));
    }
  } catch (e) {} finally { flushing = false; }
}
window.addEventListener("online", flushLog);
function setSync(msg){ $("sync").textContent = msg; }

async function refresh(manual){
  if (refreshing) return;
  refreshing = true;
  if (manual) setSync("확인하는 중…");
  try {
    const ver = await remoteVersion();
    // 화면(앱 자체)이 새로 나왔으면 한 번 다시 불러온다. 열어 둔 채로 쓰던 핸드폰에도 새 기능이 바로 보이도록
    if (SHELL && ver.shell && ver.shell !== SHELL && sessionStorage.getItem("upche-reload") !== ver.shell) {
      sessionStorage.setItem("upche-reload", ver.shell);
      await fetch(location.pathname, {cache: "reload"}).catch(() => {});  // 저장해 둔 예전 화면을 새것으로 바꿔 놓고
      location.reload();
      return;
    }
    if (ver.v !== localStorage.getItem(K_VER) || !DATA) {
      const buf = await fetchData(ver.v);
      let d;
      try { d = await decrypt(buf, b64dec(localStorage.getItem(K_KEY))); }
      catch (e) { lock("비밀번호가 바뀌었습니다. 새 비밀번호를 입력해 주세요."); return; }
      await storeData(buf);
      localStorage.setItem(K_VER, ver.v);
      if (DATA && document.body.classList.contains("detail")) pending = d;  // 보고 있던 화면은 그대로 두고 목록으로 돌아올 때 반영
      else { const had = !!DATA; setData(d); if (had) toast("자료를 최신으로 갱신했습니다"); }
    } else if (manual) toast("이미 최신 자료입니다");
    lastCheck = Date.now();
    setSync("자동 갱신 켜짐 · 방금 확인");
  } catch (e) {
    setSync(DATA ? "인터넷에 연결되지 않아 저장된 자료로 표시합니다" : "자료를 받아오지 못했습니다. 인터넷 연결을 확인하세요.");
  } finally { refreshing = false; }
}

async function login(password){
  let buf = await cachedData(), ver = null;
  try { ver = await remoteVersion(); buf = await fetchData(ver.v); }
  catch (e) { if (!buf) throw new Error("net"); }
  const key = await deriveKey(password, new Uint8Array(buf).slice(6, 22));
  const d = await decrypt(buf, key);  // 비밀번호가 틀리면 여기서 실패
  localStorage.setItem(K_KEY, b64enc(key));
  if (ver) localStorage.setItem(K_VER, ver.v);
  await storeData(buf);
  document.body.classList.remove("locked");
  lastCheck = Date.now();
  setSync("자동 갱신 켜짐 · 방금 확인");
  setData(d);
  logEvent("접속", "처음 로그인");
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!$("nm").hidden) {
    const name = $("nm").value.trim();
    if (name.length < 2 || name.length > 12 || /\d/.test(name)) {
      $("loginMsg").textContent = "본인 이름(실명)을 입력해 주세요. 예) 홍길동";
      return;
    }
    const before = localStorage.getItem(K_NAME);
    localStorage.setItem(K_NAME, name);
    localStorage.setItem(K_ROUND, String(LOG.round || 1));
    logEvent("이름 등록", before && before !== name ? `${before} → ${name}` : name);
  }
  if ($("pw").hidden) {  // 비밀번호는 이미 넣은 기기: 이름만 받고 바로 연다
    document.body.classList.remove("locked");
    $("loginMsg").textContent = "";
    boot();
    return;
  }
  const pw = $("pw").value;
  if (!pw) return;
  $("loginMsg").textContent = "확인하는 중…";
  try { await login(pw); $("loginMsg").textContent = ""; }
  catch (err) {
    $("loginMsg").textContent = err.message === "net"
      ? "자료를 받아오지 못했습니다. 인터넷 연결을 확인하세요." : "비밀번호가 맞지 않습니다.";
  }
});
$("reload").addEventListener("click", () => refresh(true));
$("lock").addEventListener("click", () => lock(""));

// ---- 관리자: 사용 기록 보기 ----
// 관리자 PC 가 모아서 '관리자 비밀번호'로 잠가 올린 log.bin 을 받아 푼다. 직원용 비밀번호로는 풀리지 않는다.
const K_ADMIN = "upche-adminkey", LOG_PAGE = 100;
let LOGS = [], logShown = 0, logFiltered = [];
async function fetchLogs(){
  const r = await fetch("log.bin?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error(r.status === 404 ? "none" : "net");
  return r.arrayBuffer();
}
async function showLogs(){
  document.body.classList.remove("detail");
  document.body.classList.add("logs");
  window.scrollTo(0, 0);
  const k = localStorage.getItem(K_ADMIN);
  if (!k) { $("adminForm").hidden = false; $("logView").hidden = true; $("apw").focus(); return; }
  $("adminForm").hidden = true;
  $("logView").hidden = false;
  $("logCount").textContent = "받는 중…";
  try {
    await openLogs(await decrypt(await fetchLogs(), b64dec(k)));
  } catch (e) {
    if (e.message === "none") { $("logCount").textContent = "아직 올라온 기록이 없습니다."; return; }
    if (e.message === "net") { $("logCount").textContent = "기록을 받아오지 못했습니다. 인터넷 연결을 확인하세요."; return; }
    localStorage.removeItem(K_ADMIN);  // 관리자 비밀번호가 바뀌었다
    $("adminMsg").textContent = "관리자 비밀번호가 바뀌었습니다. 다시 입력해 주세요.";
    $("adminForm").hidden = false; $("logView").hidden = true;
  }
}
// log.bin 에 든 기록(관리자 PC 가 마지막으로 올린 것)을 먼저 보이고, 그 뒤에 쌓인 기록은 구글 시트에서 직접 받아 푼다.
// PC·핸드폰 모두 시트로 기록을 보내므로 관리자 PC 가 꺼져 있어도 최신 기록이 보인다.
const K_LOGCACHE = "upche-logcache";
async function openLogs(d){
  setLogs(d.list || [], d.key ? "새 기록을 받는 중…" : `기록 기준 ${d.built} · 관리자 PC 에서 올린 기록입니다`);
  if (d.key && d.csv) {
    try {
      setLogs(mergeLogs(d.list || [], await liveLogs(d), d.names || {}),
              `최신 기록 · ${stamp().slice(5, 16)} 받음 · 방금 한 일은 5분쯤 뒤에 나타납니다`);
    } catch (e) {
      $("logBuilt").textContent = `새 기록을 받아오지 못했습니다(인터넷 확인). ${d.built} 까지의 기록입니다`;
    }
  }
  logEvent("기록 보기", `${LOGS.length}건`);
}
const b64udec = s => b64dec(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
async function unsealM(priv, pub, line){
  const blob = b64dec(line.slice(3)), eph = blob.slice(0, 65), iv = blob.slice(65, 77);
  const peer = await crypto.subtle.importKey("raw", eph, {name: "ECDH", namedCurve: "P-256"}, false, []);
  const shared = await crypto.subtle.deriveBits({name: "ECDH", public: peer}, priv, 256);
  const hk = await crypto.subtle.importKey("raw", shared, "HKDF", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: concat(new TextEncoder().encode("upche-log-m1"), eph, pub)},
    hk, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, blob.slice(77))));
}
async function liveLogs(d){
  const r = await fetch(d.csv, {cache: "no-store"});
  if (!r.ok) throw new Error("net");
  const lines = (await r.text()).match(/m1:[A-Za-z0-9+\/=]+/g) || [];
  const priv = await crypto.subtle.importKey("jwk", d.key, {name: "ECDH", namedCurve: "P-256"}, false, ["deriveBits"]);
  const pub = concat(new Uint8Array([4]), b64udec(d.key.x), b64udec(d.key.y));
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(K_LOGCACHE) || "{}"); } catch (e) {}
  const out = [], keep = {};
  for (let i = 0; i < lines.length; i += 40) {  // 한 번에 40줄씩 동시에 푼다. 한 번 푼 줄은 기억해 두고 다시 풀지 않는다
    await Promise.all(lines.slice(i, i + 40).map(async line => {
      const id = line.slice(3, 47);  // 줄마다 다른 임시 열쇠 부분
      let rec = cache[id];
      if (!rec) { try { rec = await unsealM(priv, pub, line); } catch (e) { return; } }
      keep[id] = rec;
      out.push(rec);
    }));
  }
  try { localStorage.setItem(K_LOGCACHE, JSON.stringify(keep)); } catch (e) {}
  return out;
}
function recId(r){  // usage.record_id 와 같아야 한다
  return [r.ms ?? r.t ?? "", r.dev || r.pc || "", r.a || "", r.d || "", r.q || ""].join("|");
}
// 사용자·기기 칸: usage.display 와 같은 규칙 (관리자가 정해 둔 실명이 있으면 실명)
function whoOf(r, names){
  const phone = String(r.pc || "").startsWith("핸드폰");
  const key = r.dev || (phone ? r.u : r.pc) || "";
  const real = names[key] || (phone ? names[r.u] : "") || "";
  if (phone) return [real || r.u || "", (r.pc || "") + (real && r.u && r.u !== real ? " · 입력한 이름 " + r.u : "")];
  const entered = "w" in r && r.u && r.u !== r.pc ? r.u : "";
  const windows = r.w || (!("w" in r) && r.u !== r.pc ? r.u : "");
  return [real || entered || key, (r.pc || "") + (windows ? " · 윈도우 " + windows : "")
          + (real && entered && entered !== real ? " · 입력한 이름 " + entered : "")];
}
function mergeLogs(archive, live, names){
  const seen = new Set(), out = [];
  for (const r of archive) { seen.add(recId(r)); out.push(r); }
  for (const r of live) {
    const id = recId(r);
    if (seen.has(id)) continue;
    seen.add(id);
    const [U, D] = whoOf(r, names);
    out.push(Object.assign({}, r, {U, D}));
  }
  return out.sort((a, b) => a.t === b.t ? (b.ms || 0) - (a.ms || 0) : (a.t < b.t ? 1 : -1));
}
function setLogs(list, note){
  LOGS = list;
  $("logBuilt").textContent = note;
  const fill = (sel, first, values) => {
    const keep = sel.value;
    sel.innerHTML = [first, ...values].map(v => `<option>${esc(v)}</option>`).join("");
    if ([first, ...values].includes(keep)) sel.value = keep;
  };
  fill($("logWho"), "모든 사람", [...new Set(LOGS.map(r => r.U || r.u))].sort());
  fill($("logWhat"), "모든 동작", [...new Set(LOGS.map(r => r.a))].sort());
  drawLogs();
}
function drawLogs(){
  const who = $("logWho").value, what = $("logWhat").value;
  logFiltered = LOGS.filter(r => (who === "모든 사람" || (r.U || r.u) === who) && (what === "모든 동작" || r.a === what));
  logShown = 0;
  $("logList").innerHTML = "";
  $("logCount").textContent = logFiltered.length.toLocaleString() + "건";
  moreLogs();
}
function moreLogs(){
  const html = logFiltered.slice(logShown, logShown + LOG_PAGE).map(r =>
    `<div class="logrow"><div class="lt">${esc(r.t)} · <b>${esc(r.U || r.u)}</b> · ${esc(r.D || r.pc)}</div>`
    + `<div class="la">${esc(r.a)}${r.d ? " · " + esc(r.d) : ""}</div>`
    + (r.q ? `<div class="lq">검색어: ${esc(r.q)}</div>` : "") + `</div>`);
  $("logList").insertAdjacentHTML("beforeend", html.join(""));
  logShown = Math.min(logFiltered.length, logShown + LOG_PAGE);
  $("logMore").hidden = logShown >= logFiltered.length;
}
$("adminForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("apw").value;
  if (!pw) return;
  $("adminMsg").textContent = "확인하는 중…";
  try {
    const buf = await fetchLogs();
    const key = await deriveKey(pw, new Uint8Array(buf).slice(6, 22));
    const d = await decrypt(buf, key);  // 비밀번호가 틀리면 여기서 실패
    localStorage.setItem(K_ADMIN, b64enc(key));
    $("apw").value = ""; $("adminMsg").textContent = "";
    $("adminForm").hidden = true; $("logView").hidden = false;
    $("logCount").textContent = "받는 중…";
    openLogs(d);
  } catch (err) {
    $("adminMsg").textContent = err.message === "none" ? "아직 올라온 기록이 없습니다. 관리자 PC 에서 먼저 올려 주세요."
      : err.message === "net" ? "기록을 받아오지 못했습니다. 인터넷 연결을 확인하세요." : "관리자 비밀번호가 맞지 않습니다.";
  }
});
$("logsBtn").addEventListener("click", () => { location.hash = "logs"; });
$("logsBack").addEventListener("click", () => history.length > 1 ? history.back() : (location.hash = ""));
$("logWho").addEventListener("change", drawLogs);
$("logWhat").addEventListener("change", drawLogs);
$("logMore").addEventListener("click", moreLogs);
$("logReload").addEventListener("click", showLogs);
$("logForget").addEventListener("click", () => {  // 기억해 둔 열쇠와 풀어 둔 기록을 이 기기에서 지운다
  localStorage.removeItem(K_ADMIN); localStorage.removeItem(K_LOGCACHE); showLogs();
});
$("install").addEventListener("click", () => { if (installEvent) { installEvent.prompt(); installEvent = null; $("install").hidden = true; } });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; $("install").hidden = false; });
document.addEventListener("visibilitychange", () => {
  if (!EMBED && !document.hidden && localStorage.getItem(K_KEY) && Date.now() - lastCheck > 5 * 60000) refresh();
});

// 앱 화면 자체가 새로 나왔으면 한 번 다시 불러온다 (서버의 것을 저장본 없이 직접 받아 본다)
async function checkShell(){
  try {
    const ver = await remoteVersion();
    if (SHELL && ver.shell && ver.shell !== SHELL && sessionStorage.getItem("upche-reload") !== ver.shell) {
      sessionStorage.setItem("upche-reload", ver.shell);
      await fetch(location.pathname, {cache: "reload"}).catch(() => {});  // 저장해 둔 예전 화면을 새것으로 바꿔 놓고
      location.reload();
    }
  } catch (e) {}
}

async function boot(){
  if (EMBED) { setData(EMBED); route(); return; }
  $("tools").hidden = false;
  if (!window.crypto || !crypto.subtle) {
    document.body.classList.add("locked");
    $("loginMsg").textContent = "이 주소로는 열 수 없습니다. https 로 시작하는 주소로 접속해 주세요.";
    return;
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $("iosTip").hidden = false;
  const k = localStorage.getItem(K_KEY);
  if (!k || nameNeeded()) {
    lock("", true);
    checkShell();  // 비밀번호·이름을 묻는 화면에서도 새 화면이 나왔는지 본다
    return;
  }
  const buf = await cachedData();
  if (buf) { try { setData(await decrypt(buf, b64dec(k))); } catch (e) {} }
  logEvent("접속");
  flushLog();
  refresh();
}
boot();
